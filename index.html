function lunarMonthDays(y,m){return(LUNAR_INFO[y-1900]&(0x10000>>m))?30:29;}
function leapMonth(y){return LUNAR_INFO[y-1900]&0xf;}
function leapDays(y){if(leapMonth(y))return(LUNAR_INFO[y-1900]&0x10000)?30:29;return 0;}
function lunarYearDays(y){let s=348;for(let i=0x8000;i>0x8;i>>=1)s+=(LUNAR_INFO[y-1900]&i)?1:0;return s+leapDays(y);}

function solarToLunar(sy, sm, sd) {
    // 使用 Date.UTC 確保無時區偏移，Math.floor 確保精確整數
    const base = Date.UTC(1900, 0, 31);
    const target = Date.UTC(sy, sm - 1, sd);
    let offset = Math.floor((target - base) / 86400000);

    let ly = 1900;
    for (; ly < 2101; ly++) {
        const yDays = lunarYearDays(ly);
        if (offset < yDays) break;
        offset -= yDays;
    }
    const leap = leapMonth(ly);
    let lm = 0, isLeapMonth = false;
    for (let i = 1; i <= 12; i++) {
        const mDays = lunarMonthDays(ly, i);
        if (offset < mDays) { lm = i; break; }
        offset -= mDays;
        if (i === leap) {
            const lDays = leapDays(ly);
            if (offset < lDays) { lm = i; isLeapMonth = true; break; }
            offset -= lDays;
        }
    }
    if (lm === 0) lm = 12;
    return { year: ly, month: lm, day: offset + 1, isLeap: isLeapMonth, leapMonth: leap };
}

// ================================================================
//  1. 年干支計算
// ================================================================
function getYearGanZhi(year) {
    const g = (year - 4) % 10;
    const z = (year - 4) % 12;
    return { gan: TIAN_GAN[g], zhi: DI_ZHI[z], ganIdx: g, zhiIdx: z };
}

// ================================================================
//  2. 五行局 (由命宮的納音五行決定)
// ================================================================
// 宮位天干由年干 + 月份推算（五虎遁）
function getPalaceGan(yearGan, monthOrDzIdx) {
    // 五虎遁年上起月：甲己之年丙作首，乙庚之年戊為頭...
    const startMap = { 0:2, 1:4, 2:6, 3:8, 4:0, 5:2, 6:4, 7:6, 8:8, 9:0 };
    const yIdx = TG_INDEX[yearGan];
    const base = startMap[yIdx];
    // 寅=2 is the first month, so dz index 2 maps to offset 0
    const offset = ((monthOrDzIdx - 2) + 12) % 12;
    return TIAN_GAN[(base + offset) % 10];
}

// ================================================================
//  3. 命宮、身宮定位
// ================================================================
function getMingGongDz(lunarMonth, hourIdx) {
    // 命宮地支：正月在寅，順數至生月，再逆數至生時（子時算第0步）
    // 公式：(2 + month - 1 - hourIdx + 12) % 12
    const idx = ((2 + lunarMonth - 1 - hourIdx) % 12 + 12) % 12;
    return idx; // index into DI_ZHI
}

function getShenGongDz(lunarMonth, hourIdx) {
    // 身宮地支：正月在寅，順數至生月，再順數至生時（子時算第0步）
    // 公式：(2 + month - 1 + hourIdx) % 12
    const idx = (2 + lunarMonth - 1 + hourIdx) % 12;
    return idx;
}

// ================================================================
//  4. 安紫微星 (餘數定宮、商數定步法)
// ================================================================
// 「六五四三二，酉午亥辰丑」
// 餘數對應宮位表：
const ZIWEI_REMAINDER = {
    2: { 1: 1 },             // 水二局: 餘1=丑
    3: { 1: 4, 2: 1 },       // 木三局: 餘1=辰, 餘2=丑
    4: { 1: 11, 2: 4, 3: 1 },// 金四局: 餘1=亥, 餘2=辰, 餘3=丑
    5: { 1: 6, 2: 11, 3: 4, 4: 1 }, // 土五局: 餘1=午, 餘2=亥, 餘3=辰, 餘4=丑
    6: { 1: 5, 2: 6, 3: 0, 4: 7, 5: 9 }, // 火六局: 餘1=巳, 餘2=午, 餘3=子, 餘4=未, 餘5=酉
};

function getZiweiDz(lunarDay, juNum) {
    const quotient = Math.floor(lunarDay / juNum);
    const remainder = lunarDay % juNum;

    if (remainder === 0) {
        // 整除：從寅宮起走 quotient 步（寅算第1步）
        return (2 + quotient - 1) % 12;
    } else {
        if (quotient === 0) {
            // 商=0（日數 < 局數）：直接在餘數宮安紫微
            return ZIWEI_REMAINDER[juNum][remainder];
        } else {
            // 從餘數宮的前一宮起，走 quotient 步（起點算第1步）
            const remDzIdx = ZIWEI_REMAINDER[juNum][remainder];
            const startDzIdx = (remDzIdx + 1) % 12;
            return (startDzIdx + quotient - 1) % 12;
        }
    }
}

// ================================================================
//  5. 十四主星安星
// ================================================================
// 紫微星系 (紫微, 天機, 太陽, 武曲, 天同, 廉貞)
function getZiweiGroup(ziweiDzIdx) {
    // Offsets from 紫微 position (counterclockwise)
    // 紫微→天機: -1, 空→太陽: -3, 武曲: -4, 天同: -5, 空→廉貞: -8
    return {
        '紫微': ziweiDzIdx,
        '天機': (ziweiDzIdx - 1 + 12) % 12,
        '太陽': (ziweiDzIdx - 3 + 12) % 12,
        '武曲': (ziweiDzIdx - 4 + 12) % 12,
        '天同': (ziweiDzIdx - 5 + 12) % 12,
        '廉貞': (ziweiDzIdx - 8 + 12) % 12,
    };
}

// 天府星系 (天府, 太陰, 貪狼, 巨門, 天梁, 七殺, 破軍, 天相)
function getTianfuGroup(ziweiDzIdx) {
    // 天府 mirrors 紫微: if 紫微 at dz, 天府 at (寅+寅 - dz) = (4 - dz)
    // Actually: 紫微與天府以寅-申軸對稱
    const tianfuIdx = (4 - ziweiDzIdx + 12) % 12;
    // The rest follow sequentially from 天府
    return {
        '天府': tianfuIdx,
        '太陰': (tianfuIdx + 1) % 12,
        '貪狼': (tianfuIdx + 2) % 12,
        '巨門': (tianfuIdx + 3) % 12,
        '天相': (tianfuIdx + 4) % 12,
        '天梁': (tianfuIdx + 5) % 12,
        '七殺': (tianfuIdx + 6) % 12,
        '破軍': (tianfuIdx + 10) % 12,
    };
}

// 文昌、文曲 (依出生時辰)
function getWenStars(hourIdx) {
    // 文昌：戌起子時逆行
    const wenchangIdx = (10 - hourIdx + 12) % 12;
    // 文曲：辰起子時順行
    const wenquIdx = (4 + hourIdx) % 12;
    return { '文昌': wenchangIdx, '文曲': wenquIdx };
}

// 左輔、右弼 (依農曆月)
function getZuoYou(lunarMonth) {
    // 左輔：辰起正月順行
    const zuofuIdx = (4 + lunarMonth - 1) % 12;
    // 右弼：戌起正月逆行
    const youbiIdx = (10 - lunarMonth + 1 + 12) % 12;
    return { '左輔': zuofuIdx, '右弼': youbiIdx };
}

// 擎羊、陀羅、火星、鈴星
function getShaStars(yearGan, hourIdx) {
    // 擎羊：年干定位
    const qingyangTable = { '甲':'卯','乙':'辰','丙':'午','丁':'未','戊':'午','己':'未','庚':'酉','辛':'戌','壬':'子','癸':'丑' };
    // 陀羅：擎羊前一位
    const tuoluoTable = { '甲':'丑','乙':'寅','丙':'辰','丁':'巳','戊':'辰','己':'巳','庚':'未','辛':'申','壬':'戌','癸':'亥' };

    const qyIdx = DZ_INDEX[qingyangTable[yearGan]];
    const tlIdx = DZ_INDEX[tuoluoTable[yearGan]];

    // 火星 (依年支和時辰，簡化版：寅午戌年起丑，申子辰年起寅，巳酉丑年起卯，亥卯未年起酉)
    // 簡化：以時辰順行
    const huoxingBase = [2, 3, 1, 9]; // 寅午戌, 申子辰, 巳酉丑, 亥卯未
    const huoxingIdx = (1 + hourIdx) % 12; // simplified

    // 鈴星 (similar pattern, simplified)
    const lingxingIdx = (10 + hourIdx) % 12; // simplified

    return {
        '擎羊': qyIdx,
        '陀羅': tlIdx,
        '火星': huoxingIdx,
        '鈴星': lingxingIdx,
    };
}

// 地空、地劫 (依時辰)
function getDiKongJie(hourIdx) {
    // 地劫：亥起子時順行
    const dijieIdx = (11 + hourIdx) % 12;
    // 地空：亥起子時逆行
    const dikongIdx = (11 - hourIdx + 12) % 12;
    return { '地空': dikongIdx, '地劫': dijieIdx };
}

// 祿存 (依年干)
function getLucun(yearGan) {
    const table = { '甲':'寅','乙':'卯','丙':'巳','丁':'午','戊':'巳','己':'午','庚':'申','辛':'酉','壬':'亥','癸':'子' };
    return { '祿存': DZ_INDEX[table[yearGan]] };
}

// 天馬 (依年支)
function getTianma(yearZhi) {
    const table = { '寅':'申','申':'寅','巳':'亥','亥':'巳','子':'寅','午':'申','卯':'巳','酉':'亥','辰':'寅','戌':'申','丑':'亥','未':'巳' };
    return { '天馬': DZ_INDEX[table[yearZhi]] };
}

// ================================================================
//  7. 大限計算
// ================================================================
function getDaxianStart(juNum) {
    return juNum; // 大限起始歲數 = 五行局數 - simplified: actually ju number + some offset
    // Typically: 水二局起2歲, 木三局起3歲, etc.
}

function getDaxianDirection(yearGanIdx, gender) {
    // 陽男陰女順行，陰男陽女逆行
    const isYangGan = (yearGanIdx % 2 === 0);
    const isMale = (gender === 'M');
    return (isYangGan === isMale) ? 1 : -1; // 1=順, -1=逆
}

// ================================================================
//  8. MASTER: 完整排盤
// ================================================================
function calculateChart(lunarYear, lunarMonth, lunarDay, hourIdx, gender, isLeap) {
    const yearGZ = getYearGanZhi(lunarYear);
    const yearGan = yearGZ.gan;
    const yearZhi = yearGZ.zhi;

    // If leap month and month > 15th day, treat as next month for some schools
    let effectiveMonth = lunarMonth;

    // 1. 命宮地支
    const mingDzIdx = getMingGongDz(effectiveMonth, hourIdx);
    const shenDzIdx = getShenGongDz(effectiveMonth, hourIdx);

    // 2. 命宮天干 (五虎遁)
    const mingGan = getPalaceGan(yearGan, mingDzIdx);

    // 3. 五行局
    const juNum = getWuxingJu(mingGan, DI_ZHI[mingDzIdx]);

    // 4. 十二宮排列 (從命宮開始逆時針)
    const palaces = [];
    for (let i = 0; i < 12; i++) {
        const dzIdx = (mingDzIdx + i) % 12; // 命宮起順行排宮名，但實際是逆時針
        // Actually: 命宮之後，兄弟在命宮逆一位(地支-1)
        const actualDzIdx = (mingDzIdx - i + 12) % 12;
        const pGan = getPalaceGan(yearGan, actualDzIdx);
        palaces.push({
            name: PALACE_NAMES[i],
            dzIdx: actualDzIdx,
            dz: DI_ZHI[actualDzIdx],
            gan: pGan,
            stars: { m: [], a: [], b: [], minor: [] },
            isMing: (i === 0),
            isShen: (actualDzIdx === shenDzIdx)
        });
    }

    // 5. 安紫微星
    const ziweiDzIdx = getZiweiDz(lunarDay, juNum);

    // 6. 安十四主星
    const ziweiGroup = getZiweiGroup(ziweiDzIdx);
    const tianfuGroup = getTianfuGroup(ziweiDzIdx);
    const mainStars = { ...ziweiGroup, ...tianfuGroup };

    // Place main stars
    for (const [star, dzIdx] of Object.entries(mainStars)) {
        const p = palaces.find(pp => pp.dzIdx === dzIdx);
        if (p) p.stars.m.push(star);
    }

    // 7. 輔助星
    const wenStars = getWenStars(hourIdx);
    const zuoyou = getZuoYou(effectiveMonth);
    const kuiyue = getKuiYue(yearGan);
    const lucun = getLucun(yearGan);
    const tianma = getTianma(yearZhi);

    const assistStars = { ...wenStars, ...zuoyou, ...kuiyue, ...lucun, ...tianma };
    for (const [star, dzIdx] of Object.entries(assistStars)) {
        const p = palaces.find(pp => pp.dzIdx === dzIdx);
        if (p) p.stars.a.push(star);
    }

    // 8. 煞星
    const shaStars = getShaStars(yearGan, hourIdx);
    const dikj = getDiKongJie(hourIdx);
    const badStars = { ...shaStars, ...dikj };
    for (const [star, dzIdx] of Object.entries(badStars)) {
        const p = palaces.find(pp => pp.dzIdx === dzIdx);
        if (p) p.stars.b.push(star);
    }

    // 9. 大限
    // 順行：從命宮往地支增加方向（子→丑→寅→...）
    // 逆行：從命宮往地支減少方向（子→亥→戌→...）
    const daxianStart = juNum;
    const daxianDir = getDaxianDirection(yearGZ.ganIdx, gender);

    const daxianList = []; // ordered list of daxian periods
    for (let i = 0; i < 12; i++) {
        const idx = (mingDzIdx + daxianDir * (i + 1) + 120) % 12;
        const p = palaces.find(pp => pp.dzIdx === idx);
        if (p) {
            const startAge = daxianStart + i * 10;
            const endAge = startAge + 9;
            p.daxian = `${startAge}-${endAge}`;
            p.daxianStart = startAge;
            p.daxianEnd = endAge;
            daxianList.push({ palaceName: p.name, dz: p.dz, gan: p.gan, dzIdx: idx, startAge, endAge });
        }
    }

    return {
        yearGan, yearZhi, mingDzIdx, shenDzIdx,
        mingGan, juNum, palaces,
        ziweiDzIdx, lunarYear: lunarYear,
        daxianDir: daxianDir > 0 ? '順行' : '逆行',
        daxianList,
        mainStarsMap: mainStars,
        assistStarsMap: assistStars,
    };

// ================================================================
// Standard layout:
//  巳(5)  午(6)  未(7)  申(8)
//  辰(4)  [center]       酉(9)
//  卯(3)  [center]       戌(10)
//  寅(2)  丑(1)  子(0)  亥(11)
const GRID_ORDER = [5, 6, 7, 8, 4, -1, -2, 9, 3, -3, -4, 10, 2, 1, 0, 11];
// -1 = first center cell (render), -2/-3/-4 = skip

function palaceByDz(palaces, dzIdx) {
    return palaces.find(p => p.dzIdx === dzIdx);
}

// ================================================================
//  FLYING PALACE ENGINE (from previous version)
// ================================================================
function findStarInPalaces(palaces, starName) {
    for (const p of palaces) {
        const all = [...p.stars.m, ...p.stars.a, ...p.stars.b, ...p.stars.minor];
        if (all.includes(starName)) return p;
    }
    return null;
}

function computeFly(palaces, gan) {
    const sh = SIHUA[gan];
    if (!sh) return null;
    const result = {};
    for (const k of SH_KEYS) {
        const star = sh[k];
        const target = findStarInPalaces(palaces, star);
        result[k] = { star, targetPalace: target ? target.name : '(盤外)', targetDz: target ? target.dz : '' };
    }
    return result;
}

function detectSelfTrans(palace) {
    const sh = SIHUA[palace.gan];
    if (!sh) return [];
    const all = [...palace.stars.m, ...palace.stars.a, ...palace.stars.b];
    const res = [];
    for (const k of SH_KEYS) {
        if (all.includes(sh[k])) res.push({ type: k, star: sh[k] });
    }
    return res;
}

let chartData = null;
let selectedFly = '';
let currentDaxian = null; // { palaceName, gan, startAge, endAge }
let flowYearGan = '丙';
let currentAge = 0;

function getFlowYearGan(westernYear) {
    return TIAN_GAN[(westernYear - 4) % 10];
}

function getCurrentDaxian(daxianList, age) {
    for (const dx of daxianList) {
        if (age >= dx.startAge && age <= dx.endAge) return dx;
    }
    // If age is before first daxian (童限), return null
    return null;
}

function initDateSelects() {
    const ySel = document.getElementById('solarYear');
    const mSel = document.getElementById('solarMonth');
    const dSel = document.getElementById('solarDay');

    for (let i = 1924; i <= 2043; i++) {
        ySel.options.add(new Option(i + ' 年', i));
    }
    ySel.value = 1966;

    for (let i = 1; i <= 12; i++) {
        mSel.options.add(new Option(i + ' 月', i));
    }
    mSel.value = 12;

    function updateDays() {
        const y = parseInt(ySel.value);
        const m = parseInt(mSel.value);
        const daysInMonth = new Date(y, m, 0).getDate();
        const currentDay = parseInt(dSel.value) || 1;
        dSel.innerHTML = '';
        for (let i = 1; i <= daysInMonth; i++) {
            dSel.options.add(new Option(i + ' 日', i));
        }
        dSel.value = currentDay > daysInMonth ? daysInMonth : currentDay;
    }

    ySel.addEventListener('change', updateDays);
    mSel.addEventListener('change', updateDays);
    updateDays();
    dSel.value = 1;
}

function runChart() {
    const solarY = parseInt(document.getElementById('solarYear').value);
    const solarM = parseInt(document.getElementById('solarMonth').value);
    const solarD = parseInt(document.getElementById('solarDay').value);
    const hr = parseInt(document.getElementById('birthHour').value);
    const gd = document.getElementById('gender').value;
    const fy = parseInt(document.getElementById('flowYear').value);

    // 國曆→農曆轉換
    const lunar = solarToLunar(solarY, solarM, solarD);
    lastLunar = { ...lunar, solarY, solarM, solarD };

    chartData = calculateChart(lunar.year, lunar.month, lunar.day, hr, gd, lunar.isLeap ? 1 : 0);

    // Derive flow year 天干
    flowYearGan = getFlowYearGan(fy);

    // Compute current age (虛歲 = 流年 - 出生農曆年 + 1)
    currentAge = fy - lunar.year + 1;
    if (currentAge < 1) currentAge = 1;

    // Find current daxian
    currentDaxian = getCurrentDaxian(chartData.daxianList, currentAge);

    selectedFly = document.getElementById('flySource').value;

    renderGrid();
    buildFlySelector();
    renderReport();
    updateBirthInfo();
}

function updateBirthInfo() {
    const d = chartData;
    const monthNames = ['','正','二','三','四','五','六','七','八','九','十','十一','十二'];
    const dayNames = ['','初一','初二','初三','初四','初五','初六','初七','初八','初九','初十',
        '十一','十二','十三','十四','十五','十六','十七','十八','十九','二十',
        '廿一','廿二','廿三','廿四','廿五','廿六','廿七','廿八','廿九','三十'];
    const hourNames = ['子','丑','寅','卯','辰','巳','午','未','申','酉','戌','亥'];
    const hr = parseInt(document.getElementById('birthHour').value);
    const fy = parseInt(document.getElementById('flowYear').value);
    const juName = JU_NAMES_CORRECT[d.juNum] || `${d.juNum}局`;
    const nayinKey = d.mingGan + DI_ZHI[d.mingDzIdx];
    const nayinName = NAYIN_NAMES[nayinKey] || '';
    const dxInfo = currentDaxian
        ? `大限${currentDaxian.palaceName}（${currentDaxian.gan}干・${currentDaxian.startAge}-${currentDaxian.endAge}歲）`
        : '童限';
    const L = lastLunar;
    const leapTag = L && L.isLeap ? '（閏）' : '';
    const lunarStr = L ? `${L.year}年${leapTag}${monthNames[L.month]}月${dayNames[L.day] || L.day + '日'}` : '';

    document.getElementById('birthInfo').innerHTML =
        `國曆 ${L ? L.solarY : ''}/${L ? L.solarM : ''}/${L ? L.solarD : ''} → 農曆 <b>${lunarStr}</b>　${hourNames[hr]}時　｜　` +
        `<b>${d.yearGan}${d.yearZhi}年</b>　${juName}　${d.daxianDir}　｜　` +
        `流年${flowYearGan}（${fy}）虛歲${currentAge}　｜　` +
        `<b style="color:var(--gold-light)">${dxInfo}</b>`;
}

function renderGrid() {
    const chart = document.getElementById('chartArea');
    chart.innerHTML = '';
    const palaces = chartData.palaces;
    const bGan = chartData.yearGan;
    const yGan = flowYearGan;
    const bSh = SIHUA[bGan];
    const ySh = SIHUA[yGan];

    // Determine highlights
    const hl = getHighlights(palaces, bGan, yGan);

    GRID_ORDER.forEach((dzIdx, i) => {
        const div = document.createElement('div');

        if (dzIdx === -1) {
            // Center box
            div.className = 'center-box';
            div.style.gridColumn = '2/4';
            div.style.gridRow = '2/4';
            renderCenter(div, palaces, bGan, yGan);
            chart.appendChild(div);
            return;
        }
        if (dzIdx < -1) return; // skip

        const palace = palaceByDz(palaces, dzIdx);
        if (!palace) {
            div.className = 'palace';
            div.innerHTML = `<div class="dz-tag">${DI_ZHI[dzIdx]}</div><div class="p-name">（空）</div>`;
            chart.appendChild(div);
            return;
        }

        div.className = 'palace';
        if (palace.isMing) div.classList.add('is-ming');
        if (currentDaxian && palace.name === currentDaxian.palaceName) div.classList.add('is-daxian');
        if (hl.source === palace.name) div.classList.add('hl-source');
        if (hl.luTargets.includes(palace.name)) div.classList.add('hl-lu');
        if (hl.jiTargets.includes(palace.name)) div.classList.add('hl-ji');

        // Gan tag
        let ganHtml = `<div class="gan-tag">${palace.gan}</div>`;

        // Body/Shen indicator
        let bodyHtml = '';
        if (palace.isShen) bodyHtml = `<div class="body-tag">身</div>`;
        if (palace.daxian) bodyHtml += `<div class="body-tag" style="top:${palace.isShen ? 18 : 6}px;color:#b8860b;font-size:10px;">${palace.daxian}</div>`;

        // Stars
        const starArea = document.createElement('div');
        starArea.className = 'star-area';

        // Main stars
        palace.stars.m.forEach(s => {
            const el = document.createElement('div');
            el.className = 'star-item main';
            let html = s;
            for (const k of SH_KEYS) {
                if (bSh[k] === s) html += `<span class="sh-tag sh-${SH_CLS[k]}">生${k}</span>`;
                if (ySh[k] === s) html += `<span class="sh-tag sh-${SH_CLS[k]}">流${k}</span>`;
            }
            el.innerHTML = html;
            starArea.appendChild(el);
        });

        // Assist stars
        palace.stars.a.forEach(s => {
            const el = document.createElement('div');
            el.className = 'star-item assist';
            let html = s;
            for (const k of SH_KEYS) {
                if (bSh[k] === s) html += `<span class="sh-tag sh-${SH_CLS[k]}">生${k}</span>`;
                if (ySh[k] === s) html += `<span class="sh-tag sh-${SH_CLS[k]}">流${k}</span>`;
            }
            el.innerHTML = html;
            starArea.appendChild(el);
        });

        // Malefic stars
        palace.stars.b.forEach(s => {
            const el = document.createElement('div');
            el.className = 'star-item malefic';
            el.textContent = s;
            starArea.appendChild(el);
        });

        div.innerHTML = ganHtml + bodyHtml;
        div.appendChild(starArea);

        // Fly indicators
        const flyInds = document.createElement('div');
        flyInds.className = 'fly-indicators';
        getIncoming(palace, palaces, bGan, yGan).forEach(tag => flyInds.appendChild(tag));
        div.appendChild(flyInds);

        // Self-transform
        const st = detectSelfTrans(palace);
        if (st.length) {
            const stDiv = document.createElement('div');
            stDiv.className = 'self-trans';
            stDiv.innerHTML = st.map(s => `⟳${s.star}自化${s.type}`).join('<br>');
            div.appendChild(stDiv);
        }

        div.innerHTML += `<div class="dz-tag">${palace.dz}</div><div class="p-name">${palace.name}</div>`;
        chart.appendChild(div);
    });
}

function getHighlights(palaces, bGan, yGan) {
    const h = { source: '', luTargets: [], jiTargets: [], isDaxianPalace: false };
    if (!selectedFly) return h;

    let flyData = null;
    if (selectedFly === '生年') {
        flyData = computeFly(palaces, bGan);
    } else if (selectedFly === '大限' && currentDaxian) {
        flyData = computeFly(palaces, currentDaxian.gan);
        h.source = currentDaxian.palaceName;
    } else if (selectedFly === '流年') {
        flyData = computeFly(palaces, yGan);
    } else {
        h.source = selectedFly;
        const sp = palaces.find(p => p.name === selectedFly);
        if (sp) flyData = computeFly(palaces, sp.gan);
    }
    if (flyData) {
        if (flyData.祿) h.luTargets.push(flyData.祿.targetPalace);
        if (flyData.忌) h.jiTargets.push(flyData.忌.targetPalace);
    }
    return h;
}

function getIncoming(palace, palaces, bGan, yGan) {
    const tags = [];
    if (!selectedFly) return tags;

    let flyData = null;
    let label = '';
    if (selectedFly === '生年') {
        flyData = computeFly(palaces, bGan); label = '生年';
    } else if (selectedFly === '大限' && currentDaxian) {
        flyData = computeFly(palaces, currentDaxian.gan); label = '大限';
    } else if (selectedFly === '流年') {
        flyData = computeFly(palaces, yGan); label = '流年';
    } else {
        const sp = palaces.find(p => p.name === selectedFly);
        if (sp) { flyData = computeFly(palaces, sp.gan); label = sp.name; }
    }
    if (!flyData) return tags;

    for (const k of SH_KEYS) {
        if (flyData[k].targetPalace === palace.name) {
            const el = document.createElement('div');
            const isBYD = (selectedFly === '生年' || selectedFly === '流年' || selectedFly === '大限');
            el.className = `fly-ind ${isBYD ? 'birth' : 'year'} ${SH_CLS[k]}-ind`;
            el.textContent = `${label}${k}→${flyData[k].star}`;
            tags.push(el);
        }
    }
    return tags;
}

function renderCenter(div, palaces, bGan, yGan) {
    const bFly = computeFly(palaces, bGan);
    const yFly = computeFly(palaces, yGan);

    let html = '<strong>生年四化（體）：</strong><br>';
    for (const k of SH_KEYS) html += `　${k}：${bFly[k].star}→<b>${bFly[k].targetPalace}</b><br>`;

    // 大限四化
    if (currentDaxian) {
        const dxFly = computeFly(palaces, currentDaxian.gan);
        html += `<br><strong>大限四化（用）── ${currentDaxian.palaceName}（${currentDaxian.gan}干・${currentDaxian.startAge}-${currentDaxian.endAge}歲）：</strong><br>`;
        for (const k of SH_KEYS) html += `　${k}：${dxFly[k].star}→<b>${dxFly[k].targetPalace}</b><br>`;
    }

    html += `<br><strong>流年四化（出）── ${flowYearGan}年：</strong><br>`;
    for (const k of SH_KEYS) html += `　${k}：${yFly[k].star}→<b>${yFly[k].targetPalace}</b><br>`;

    html += '<br><strong>自化偵測：</strong><br>';
    let hasSelf = false;
    palaces.forEach(p => {
        const st = detectSelfTrans(p);
        if (st.length) { hasSelf = true; st.forEach(s => html += `　${p.name}：${s.star}自化${s.type}<br>`); }
    });
    if (!hasSelf) html += '　（無自化）<br>';

    const juName = JU_NAMES_CORRECT[chartData.juNum] || '';
    const nayinKey2 = chartData.mingGan + DI_ZHI[chartData.mingDzIdx];
    const nayinName2 = NAYIN_NAMES[nayinKey2] || '';
    div.innerHTML = `
        <h2>${chartData.yearGan}${chartData.yearZhi}年生</h2>
        <div class="info">命宮${chartData.mingGan}${DI_ZHI[chartData.mingDzIdx]}（${nayinName2}）　${juName}　紫微在${DI_ZHI[chartData.ziweiDzIdx]}</div>
        <div class="fly-summary">${html}</div>
    `;
}

function buildFlySelector() {
    const sel = document.getElementById('flySource');
    const cur = sel.value;
    sel.innerHTML = '<option value="">全盤總覽</option><option value="生年">生年四化（體）</option>';
    if (currentDaxian) {
        sel.innerHTML += `<option value="大限">大限四化（用）── ${currentDaxian.palaceName}（${currentDaxian.gan}干）</option>`;
    }
    sel.innerHTML += `<option value="流年">流年四化（出）── ${flowYearGan}年</option>`;
    chartData.palaces.forEach(p => {
        sel.innerHTML += `<option value="${p.name}">${p.name}（${p.gan}干）</option>`;
    });
    sel.value = cur || '';

    const btns = document.getElementById('flyBtns');
    btns.innerHTML = '';
    const topBtns = ['生年'];
    if (currentDaxian) topBtns.push('大限');
    topBtns.push('流年');
    [...topBtns, ...chartData.palaces.map(p => p.name)].forEach(s => {
        const btn = document.createElement('button');
        btn.className = 'fly-btn' + (selectedFly === s ? ' active' : '');
        const pd = chartData.palaces.find(p => p.name === s);
        if (s === '大限' && currentDaxian) {
            btn.textContent = `大限（${currentDaxian.gan}・${currentDaxian.startAge}-${currentDaxian.endAge}）`;
        } else if (s === '流年') {
            btn.textContent = `流年（${flowYearGan}）`;
        } else {
            btn.textContent = pd ? `${s}（${pd.gan}）` : s;
        }
        btn.onclick = () => {
            selectedFly = s;
            document.getElementById('flySource').value = s;
            renderGrid();
            buildFlySelector();
        };
        btns.appendChild(btn);
    });
}

function getStarInfo(starName) {
    return STAR_DB[starName] || null;
}

function getDualCombo(stars) {
    if (stars.length < 2) return null;
    // Try all pairs
    for (let i = 0; i < stars.length; i++) {
        for (let j = i + 1; j < stars.length; j++) {
            const key1 = stars[i] + ',' + stars[j];
            const key2 = stars[j] + ',' + stars[i];
            if (DUAL_STAR_COMBOS[key1]) return DUAL_STAR_COMBOS[key1];
            if (DUAL_STAR_COMBOS[key2]) return DUAL_STAR_COMBOS[key2];
        }
    }
    return null;
}

function getStarTransformations(starName, bSh, ySh) {
    const results = [];
    for (const k of SH_KEYS) {
        if (bSh[k] === starName) results.push('生' + k);
        if (ySh[k] === starName) results.push('流' + k);
    }
    return results;
}

function hasMaleficInPalace(palace) {
    const heavySha = ['擎羊', '陀羅', '火星', '鈴星', '地空', '地劫'];
    return palace.stars.b.filter(s => heavySha.includes(s));
}

function analyzeStarInPalace(palace, bSh, ySh) {
    // Build detailed analysis of stars in a palace
    const lines = [];
    const mainStars = palace.stars.m;

    mainStars.forEach(s => {
        const info = getStarInfo(s);
        if (!info) return;
        const trans = getStarTransformations(s, bSh, ySh);
        if (trans.length > 0) {
            trans.forEach(t => {
                if (t.includes('忌')) {
                    lines.push(`<b style="color:var(--quan)">⚠ ${s}${t}</b>：${t.includes('生') ? info.health_ji : '今年需注意' + info.organs + '相關問題。'}`);
                } else if (t.includes('祿')) {
                    lines.push(`✦ ${s}${t}：${info.personality.substring(0, 20)}⋯能量暢旺。`);
                }
            });
        }
    });
    return lines;
}

            card4 += `<b>${s}</b>主${info.organs}。`;
            const t3 = threeLayerStar(s);
            if (t3.some(t => t.includes('忌'))) card4 += ` <b style="color:var(--quan)">化忌：${info.health_ji}</b>`;
            if (t3.length) card4 += `（${t3.join('、')}）`;
            card4 += '<br>';
        }
    });
    if (!jieStars.length) card4 += '疾厄宮無主星，借對宮論。<br>';
    card4 += `<br><u>三層忌星對應臟腑</u>：`;
    card4 += `<br>體（生年忌）：<b>${bFly.忌.star}</b>`;
    let bi = getStarInfo(bFly.忌.star);
    if (bi) card4 += `── ${bi.organs}。${bi.health_ji ? '防：' + bi.health_ji : ''}`;
    if (hasDx) {
        card4 += `<br>用（大限忌）：<b>${dxFly.忌.star}</b>`;
        let di = getStarInfo(dxFly.忌.star);
        if (di) card4 += `── ${di.organs}。${di.health_ji ? '十年防：' + di.health_ji : ''}`;
    }
    card4 += `<br>出（流年忌）：<b>${yFly.忌.star}</b>`;
    let yi = getStarInfo(yFly.忌.star);
    if (yi) card4 += `── ${yi.organs}。${yi.health_ji ? '今年防：' + yi.health_ji : ''}`;
    card4 += `<br><br>疾厄飛忌入【${jieFly.忌.targetPalace}】── 健康隱患方向。`;
    if (hasDx && dxFly.忌.targetPalace === '疾厄宮') card4 += '<br><b style="color:var(--quan)">⚠ 大限忌入疾厄：此十年健康為重要課題。</b>';
    if (yFly.忌.targetPalace === '疾厄宮') card4 += '<br><b style="color:var(--quan)">⚠ 流年忌入疾厄：今年為健康應期。</b>';
    const jieSha = hasMaleficInPalace(jie);
    if (jieSha.length) card4 += `<br>疾厄見煞：${jieSha.join('、')}── 體質偏弱。`;

    // ===== Card 5: 感情 =====
    let card5 = '';
    const fuqiStars = fuqi.stars.m;
    fuqiStars.forEach(s => {
        const info = getStarInfo(s);
        if (info) {
            card5 += `<b>${s}</b>：${info.love}`;
            const t3 = threeLayerStar(s);
            if (t3.some(t => t.includes('忌'))) card5 += ` <b style="color:var(--quan)">${info.love_ji}</b>`;
            if (t3.length) card5 += `（${t3.join('、')}）`;
            card5 += '<br>';
        }
    });
    const fuqiCombo = getDualCombo(fuqiStars);
    if (fuqiCombo) card5 += `【${fuqiCombo.name}】${fuqiCombo.desc}<br>`;
    if (!fuqiStars.length) card5 += '夫妻宮無主星，借對宮星論之。<br>';
    card5 += `<br><u>向心離心判斷</u>：`;
    card5 += `<br>夫妻自飛：${threeLayerFly('夫妻', fuqi.gan, fuqi)}`;
    if (fuqiFly.祿.targetPalace === '命宮') card5 += '<br>✦ 夫妻飛祿入命（向心）：配偶主動付出。';
    if (fuqiFly.忌.targetPalace === '命宮') card5 += '<br>✦ 夫妻飛忌入命（黏著向心）：在意但帶壓力。';
    if (fuqiFly.祿.targetPalace === '遷移宮') card5 += '<br>⚠ 飛祿入遷移（離心）。';
    if (fuqiFly.忌.targetPalace === '遷移宮') card5 += '<br>⚠ 飛忌入遷移：心思在外。';
    if (hasDx) {
        if (dxFly.忌.targetPalace === '夫妻宮') card5 += '<br><b style="color:var(--quan)">⚠ 大限忌入夫妻：此十年感情為課題。</b>';
        if (dxFly.祿.targetPalace === '夫妻宮') card5 += '<br>✦ 大限祿入夫妻：此十年感情順遂。';
    }
    const fuqiSelfs = detectSelfTrans(fuqi);
    if (fuqiSelfs.length) {
        card5 += '<br>自化：' + fuqiSelfs.map(s => {
            if (s.type === '忌') return s.star + '自化忌 <b style="color:var(--quan)">⚠ 感情消散</b>';
            return s.star + '自化' + s.type;
        }).join('、');
    }

    // ===== Card 6: 大限總論 + 互飛 =====
    let card6 = '';
    if (hasDx) {
        card6 += `<b>目前大限：${dxLabel}</b><br>虛歲${currentAge}歲<br><br>`;
        card6 += `<u>大限四化路徑</u>：<br>`;
        for (const k of SH_KEYS) card6 += `　大限${k}：${dxFly[k].star}→【${dxFly[k].targetPalace}】<br>`;
        // 大限忌與生年忌交叉
        if (dxFly.忌.targetPalace === bFly.忌.targetPalace) card6 += '<br><b style="color:var(--quan)">⚠ 大限忌與生年忌同宮：先天弱點在此十年被引動。</b>';
        if (dxFly.祿.targetPalace === bFly.祿.targetPalace) card6 += '<br>✦ 大限祿與生年祿同宮：先天福報在此十年兌現！';
        // 大限忌入命宮
        if (dxFly.忌.targetPalace === '命宮') card6 += '<br><b style="color:var(--quan)">⚠ 大限忌入命：十年壓力在身。</b>';
        if (dxFly.祿.targetPalace === '命宮') card6 += '<br>✦ 大限祿入命：十年運勢暢旺。';
    } else {
        card6 += `虛歲${currentAge}歲，尚在童限。<br>`;
    }
    card6 += `<br><u>六大宮互飛交叉</u>：<br>` + buildCross(palaces);

    const dxTag = hasDx ? `（${currentDaxian.startAge}-${currentDaxian.endAge}歲）` : '';
    const cards = [
        { h: '一、命格星性與三層體用出', c: card1, note: '體＝生年（先天本質），用＝大限（十年走向），出＝流年（當年觸發）。' },
        { h: '二、財帛理財分析', c: card2, note: '三層忌同入一宮為「疊忌」，壓力最大。祿為進財方向。' },
        { h: '三、事業職涯走勢', c: card3, note: '大限權星定十年事業方向，流年權定今年施力處。' },
        { h: '四、健康三層忌星對照', c: card4, note: '生年忌=先天弱點，大限忌=十年隱患，流年忌=今年應期。三星對應三臟腑。' },
        { h: '五、感情婚姻向心離心', c: card5, note: '飛祿入命為向心，飛祿入遷移為離心。大限忌入夫妻=十年感情課題。' },
        { h: `六、大限總論${dxTag}與互飛`, c: card6, note: '大限為承接生年、開啟流年的橋樑。大限忌引動生年忌=宿命應驗期。' }
    ];

    document.getElementById('reportGrid').innerHTML = cards.map(d =>
        `<div class="card"><div class="card-h">${d.h}</div><p>${d.c}</p><div class="note">${d.note}</div></div>`
    ).join('');
}

function buildCross(palaces) {
    const lines = [];
    const keys = ['命宮','財帛宮','官祿宮','夫妻宮','福德宮','田宅宮'];
    keys.forEach(name => {
        const p = palaces.find(pp => pp.name === name);
        if (!p) return;
        const fly = computeFly(palaces, p.gan);
        keys.forEach(target => {
            if (target === name) return;
            if (fly.祿.targetPalace === target) lines.push(`${name}（${p.gan}）飛<b style="color:var(--lu)">祿</b>入${target}`);
            if (fly.忌.targetPalace === target) lines.push(`${name}（${p.gan}）飛<b style="color:var(--ji)">忌</b>入${target}`);
        });
    });
    return lines.length ? lines.join('<br>') : '（此格局六大宮間無直接互飛）';
}

initDateSelects();
runChart();
